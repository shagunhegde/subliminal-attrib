[project]
name = "subliminal-attribution"
version = "0.1.0"
description = "Per-example attribution of subliminally-transmitted traits in mixed fine-tuning corpora"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6,<3",
    "transformers>=4.53",
    "peft>=0.16",
    "trl>=0.21",
    "datasets>=3.0",
    "accelerate",
    "huggingface-hub",
    "pydra-config",
    # Needed only to *import* repo2's filter module: subliminal.filter pulls in
    # subliminal.judge, which imports openai at module scope. We never call the
    # judge -- the rule filter is offline. Reusing upstream costs one pure-python dep.
    "openai",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
# Installed only on the CUDA box. vllm has no macOS arm64 wheel, so it must never
# be a core dependency (see docs/deviations.md).
gpu = ["vllm>=0.10", "wandb"]
# `anthropic` powers the blind pairwise judge in `subattr.baselines` (PLAN v2
# claim C1). It is a dev/analysis dependency: nothing in the training or scoring
# path calls out to an API.
dev = ["pytest", "ipykernel", "jupyter", "anthropic"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The pinned trees under third_party/ ship their own test suites against their
# own dependency sets (uvicorn, sqlalchemy, truesight, an installed `sl`
# package). We vendor them as source trees, not installs (D5), so those suites
# cannot collect and are not ours to run.
#
# `testpaths` alone is not enough: it applies only when pytest is given NO path
# argument, so `pytest .` -- or a copy-pasted command that loses its `tests`
# argument -- walks into third_party/ and dies with 19 collection errors before
# running a single one of ours. `addopts` applies to every invocation.
addopts = "--ignore=third_party"
norecursedirs = ["third_party", ".venv", "runs", "*.egg-info"]
filterwarnings = ["ignore::DeprecationWarning"]
